# Skate 3 community online mod. Everything has a sensible default; this file is optional.
# EXPERIMENTAL: signs in with RPCN, connects to the community Blaze server, passes the profile/reports steps, reaches the main menu
# and the Online menu, and creates/joins lobbies. EA's old web pages (Online Hub, My Profile, skate.reel pages) do not exist, so
# those menu items just show the game's page-loading screen and return. Off by default; set enabled=1 to try it.
description=Skate 3 online with the community Blaze server, signing in through RPCN (the account service RPCS3 uses). Sign-in, the Online menu and lobbies work. EA's old web pages (Online Hub, My Profile) do not exist. Experimental.
enabled=0
# Log every network call (very verbose; for troubleshooting).
trace=0
# Log the game's own internal flow (state changes, dialogs). For troubleshooting only.
flow_trace=0
# The community Blaze server that replaces EA's. The EA hostnames below are redirected to it.
server_ip=172.237.109.212
redirect_hosts=gosredirector.ea.com,downloads.skate*.online.ea.com
# Online id shown to the game until you sign in with a real account.
np_name=CellForgeUser
# RPCN account service (free; the same one RPCS3 uses). You are asked to sign in the first time you go online.
rpcn_host=np.rpcs3.net
rpcn_port=31313
prompt_signin=1
# EA's profile web services are missing on the community server; answer the ones whose reply format is known (login, DLC,
# achievements, AI profile) so the game's profile steps finish. 1 = on.
fake_webservice_ok=1
# The game's embedded browser can't run here. 1 = end its page screen by itself (so the Online menu never waits forever).
webkit_autoquit=1
# 1 = skip the "exit the web browser?" Yes/No prompt the game would otherwise show over the empty page.
webkit_skip_prompt=1
