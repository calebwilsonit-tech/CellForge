# Skate3-VK Online Mod (Path A: Direct P2P / UDP Relay)
# Copy this file alongside `skate3_online.dll` into your game's `mods/` folder.

enabled=1
player_name=Skater

# Connection mode:
#   host  = host a direct P2P session on `port` (works over LAN / Tailscale / ZeroTier / port-forward)
#   join  = connect directly to a friend's host IP:port
#   relay = connect to a `relay_server.py` room by room code (no port forwarding needed)
mode=relay
host=127.0.0.1
port=37464
room=SK8A
tick_hz=60

# Optional BLUS30464 guest memory bridge addresses (hex) for live skater/ghost entity sync.
# Leave blank to run transport + telemetry only.
skater_ptr_addr=
ghost_pool_addr=
frame_hook_addr=
