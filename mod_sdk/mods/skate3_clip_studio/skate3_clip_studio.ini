# Skate3-VK Clip Studio — Instant Screenshot & Trick-Sequence Burst Mod
# Drop `skate3_clip_studio.dll` and this `.ini` into your game's `mods/` folder.
#
# Hotkeys:
#   F12 = Capture lossless PNG screenshot
#   F11 = Toggle Trick-Sequence Burst Mode
#   F5  = Open Clip Studio Panel

enabled=1
output_dir=%USERPROFILE%\Pictures\Skate3-VK
burst_fps=5
watermark=1
shutter_beep=1
